<!doctype html>
<html lang="en" translate="no">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="description" content="Metronome tempo and beat counts for darkroom f-stop test strips.">
<title>Striptest: metronome tempo for f-stop test strips</title>

<style>
  :root {
    --paper: #F3F3F1;
    --surface: #FFF;
    --ink: #161616;
    --muted: #6B6B68;
    --line: #D9D9D5;
    --accent: #B3261E;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #111;
      --surface: #1A1A1A;
      --ink: #ECECEA;
      --muted: #9A9A96;
      --line: #2C2C2C;
      --accent: #E5484D;
    }
  }

  body {
    max-width: 28rem;
    margin: 2rem auto;
    padding: 0 1.25rem;
    background: var(--paper);
    color: var(--ink);
    font: 1rem/1.5 system-ui, sans-serif;
  }

  nav {
    display: flex;
    gap: 1.25rem;
    margin-bottom: 1.5rem;
    font-size: 1rem;
  }

  nav a {
    padding: .5rem 0;
    color: var(--muted);
    text-decoration: none;
  }

  nav [aria-current] {
    border-bottom: 2px solid var(--accent);
    color: var(--ink);
  }

  form, details div {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: .75rem;
    align-items: end;
  }

  details div {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    margin-top: .5rem;
  }

  label {
    display: grid;
    gap: .25rem;
    color: var(--muted);
    font-size: .8125rem;
  }

  input, select {
    box-sizing: border-box;
    width: 100%;
    height: 2.75rem;
    padding: 0 .625rem;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--surface);
    color: var(--ink);
    font: 1.0625rem var(--mono);
  }

  input:invalid {
    border-color: var(--accent);
  }

  input:focus-visible, select:focus-visible, summary:focus-visible, button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }

  input[type=checkbox] {
    width: 1.25rem;
    height: 1.25rem;
    accent-color: var(--accent);
  }

  details {
    grid-column: 1 / -1;
  }

  summary {
    width: max-content;
    padding: .25rem 0;
    color: var(--muted);
    font-size: .875rem;
    cursor: pointer;
  }

  .wide {
    grid-column: 1 / -1;
    grid-template-columns: auto 1fr;
    align-items: center;
    gap: .625rem;
    font-size: .9375rem;
  }

  section {
    margin: 2.5rem 0 2rem;
    text-align: center;
  }

  section p {
    margin: 0;
    color: var(--muted);
  }

  #tempo {
    display: block;
    color: var(--accent);
    font: 600 5.5rem/1.1 var(--mono);
    letter-spacing: -.04em;
  }

  button {
    height: 2.75rem;
    margin: 0;
    padding: 0 .875rem;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: none;
    color: var(--muted);
    font: inherit;
    cursor: pointer;
  }

  #forget {
    grid-column: 1 / -1;
  }

  #skip {
    margin-top: 1.25rem;
  }

  #skipped {
    font-size: .875rem;
  }

  #skipped button {
    height: 2.25rem;
    margin: .375rem .125rem 0;
    padding: 0 .5rem;
    font-family: var(--mono);
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-family: var(--mono);
    font-variant-numeric: tabular-nums;
  }

  th {
    padding: 0 0 .375rem;
    color: var(--muted);
    font: .8125rem system-ui, sans-serif;
    text-align: right;
  }

  td {
    padding: .5rem 0;
    border-top: 1px solid var(--line);
    color: var(--muted);
    font-size: .9375rem;
    text-align: right;
  }

  th:nth-child(2), td:nth-child(2) {
    padding-left: .75rem;
    text-align: left;
  }

  td:first-child {
    width: 2.25rem;
    padding: .25rem 0;
  }

  td:nth-child(2) {
    color: var(--ink);
    font-size: 1.375rem;
    font-weight: 600;
  }

  tr.base td:nth-child(3) {
    color: var(--accent);
  }

  td span {
    display: block;
    box-sizing: border-box;
    height: 2.25rem;
    border: 1px solid var(--line);
    border-radius: 4px;
    background: hsl(0 0% var(--tone));
  }

  footer {
    margin-top: 2rem;
    color: var(--muted);
    font-size: .8125rem;
    text-align: center;
  }

  a {
    color: inherit;
  }
</style>

<nav>
  <a href="https://time.lutzen.co/">Time</a>
  <a aria-current="page">Striptest</a>
</nav>

<form>
  <label>Base, seconds
    <input id="base" type="number" value="10" min="0.1" step="any" required inputmode="decimal">
  </label>
  <label>Step, stops
    <select id="stepsize">
      <option value="1">1</option>
      <option value="2">1/2</option>
      <option value="3" selected>1/3</option>
      <option value="4">1/4</option>
      <option value="6">1/6</option>
      <option value="12">1/12</option>
    </select>
  </label>
  <label>Steps
    <input id="numsteps" type="number" value="7" min="1" max="24" required inputmode="numeric">
  </label>

  <details>
    <summary>Metronome and counting</summary>
    <div>
      <label>Slowest, bpm
        <input id="tmin" type="number" value="40" min="1" max="600" required inputmode="numeric">
      </label>
      <label>Fastest, bpm
        <input id="tmax" type="number" value="208" min="1" max="600" required inputmode="numeric">
      </label>
      <label>Count every
        <select id="divisions">
          <option value="0">Auto</option>
          <option value="1">beat</option>
          <option value="2">2nd beat</option>
          <option value="3">3rd beat</option>
          <option value="4">4th beat</option>
        </select>
      </label>
      <label>Base is step
        <input id="baseplace" type="number" min="-50" max="50" placeholder="middle">
      </label>
      <label class="wide">
        <input id="cumulative" type="checkbox">
        Count each step from zero, adding to the one before
      </label>
      <button id="forget" type="button"></button>
    </div>
  </details>
</form>

<section>
  <p>Set your metronome to</p>
  <output id="tempo"></output>
  <p id="notice"></p>
  <button id="skip"></button>
  <p id="skipped"></p>
</section>

<table>
  <thead>
    <tr><th></th><th>Count</th><th>Stops</th><th>Seconds</th><th>Error</th></tr>
  </thead>
  <tbody></tbody>
</table>

<footer>
  Error is a share of one step. Start every exposure on the count of zero.<br>
  <a href="https://github.com/BinFlush/striptest#readme" target="_blank">How it works and source</a>
</footer>

<script>
  const TIE = 1e-12;
  const WHITE = .05;
  const BLACK = 2.1;
  const GREY = -Math.log10(.18);
  const CONTRAST = .6;

  function range(from, to) {
    return Array.from({ length: to - from + 1 }, (_, i) => from + i);
  }

  function solve({ base, stepsize, numsteps, baseplace, tempi, cumulative, divisions }) {
    const steps = Array.from({ length: numsteps }, (_, i) => i - baseplace);
    let winner = { loss: Infinity };

    for (const tempo of [...tempi].reverse()) {
      const u = Math.log2(60 / (base * tempo));
      const rows = steps.map(step => {
        const target = step / stepsize;
        const exact = 2 ** (target - u);
        const error = beats => Math.log2(beats) + u - target;
        const low = Math.max(1, Math.floor(exact));
        const high = Math.ceil(exact);
        const beats = Math.abs(error(low)) <= Math.abs(error(high)) ? low : high;
        return { step, beats, seconds: beats * 60 / tempo, error: error(beats) };
      });
      const loss = rows.reduce((sum, row) => sum + row.error ** 2, 0);
      if (loss <= winner.loss + TIE) winner = { loss, tempo, rows };
    }

    const rows = winner.rows.map((row, i, all) => ({
      ...row,
      count: cumulative && i ? row.beats - all[i - 1].beats : row.beats,
    }));
    const every = divisions || Math.max(1, Math.floor(winner.tempo / 60));
    return { tempo: winner.tempo, every, rows };
  }

  function solveSkipping(settings, skipped) {
    const passed = [];
    let tempi = settings.tempi;
    while (tempi.length) {
      const result = solve({ ...settings, tempi });
      if (!skipped.has(result.tempo)) return { ...result, passed };
      passed.push(result.tempo);
      tempi = tempi.filter(tempo => tempo !== result.tempo);
    }
    return { passed };
  }

  function tone(stops) {
    const density = Math.min(BLACK, Math.max(WHITE, GREY + CONTRAST * stops));
    return 1.055 * (10 ** -density) ** (1 / 2.4) - .055;
  }

  function formatCount(count, every) {
    const whole = Math.floor(count / every);
    const rest = count % every;
    if (!rest) return String(whole);
    return whole ? `${whole}+${rest}/${every}` : `${rest}/${every}`;
  }

  function formatStops(step, stepsize) {
    if (!step) return 'base';
    const sign = step > 0 ? '+' : '−';
    const size = Math.abs(step);
    return size % stepsize ? `${sign}${size}/${stepsize}` : `${sign}${size / stepsize}`;
  }

  function formatError(share) {
    const percent = Math.abs(share * 100).toFixed(1);
    const sign = percent === '0.0' ? '' : share > 0 ? '+' : '−';
    return `${sign}${percent}%`;
  }

  function nthBeat(n) {
    if (n === 1) return 'beat';
    const teens = n % 100 >= 11 && n % 100 <= 13;
    return `${n}${teens ? 'th' : ['th', 'st', 'nd', 'rd'][n % 10] ?? 'th'} beat`;
  }
</script>

<script>
  const form = document.querySelector('form');
  const field = id => document.getElementById(id);
  const number = id => field(id).valueAsNumber;
  const SHOWN = 5;
  const skipped = recall();

  function recall() {
    try {
      return new Set(JSON.parse(localStorage.getItem('striptest')).skipped);
    } catch {
      return new Set();
    }
  }

  function remember() {
    try {
      localStorage.setItem('striptest', JSON.stringify({ skipped: [...skipped] }));
    } catch {}
  }

  function cell(text) {
    const td = document.createElement('td');
    td.textContent = text;
    return td;
  }

  function swatch(stops) {
    const td = document.createElement('td');
    const patch = document.createElement('span');
    patch.style.setProperty('--tone', `${(tone(stops) * 100).toFixed(1)}%`);
    td.append(patch);
    return td;
  }

  function chip(tempo) {
    const button = document.createElement('button');
    button.textContent = `${tempo} ×`;
    button.value = tempo;
    button.setAttribute('aria-label', `Bring back ${tempo}`);
    return button;
  }

  function tableRow({ step, count, seconds, error }, { stepsize }, every) {
    const tr = document.createElement('tr');
    tr.className = step ? '' : 'base';
    tr.append(
      swatch(step / stepsize),
      cell(formatCount(count, every)),
      cell(formatStops(step, stepsize)),
      cell(seconds.toFixed(2)),
      cell(formatError(error * stepsize)),
    );
    return tr;
  }

  function settings() {
    field('tmax').setCustomValidity('');
    if (!form.checkValidity()) return null;
    const tempi = range(number('tmin'), number('tmax'));
    field('tmax').setCustomValidity(tempi.length ? '' : 'No tempo in this range');
    if (!tempi.length) return null;
    const numsteps = number('numsteps');
    const place = number('baseplace');
    return {
      base: number('base'),
      stepsize: Number(field('stepsize').value),
      numsteps,
      baseplace: Number.isNaN(place) ? Math.floor((numsteps - 1) / 2) : place - 1,
      tempi,
      cumulative: field('cumulative').checked,
      divisions: Number(field('divisions').value),
    };
  }

  function render() {
    const chosen = settings();
    const result = chosen ? solveSkipping(chosen, skipped) : { passed: [] };
    const skipping = result.passed.slice(0, SHOWN).map(chip);
    if (skipping.length) skipping.unshift('Skipping ');
    if (result.passed.length > SHOWN) skipping.push(` and ${result.passed.length - SHOWN} more`);
    const rows = (result.rows ?? []).map(row => tableRow(row, chosen, result.every));
    field('tempo').textContent = result.tempo ?? '?';
    field('notice').textContent = result.tempo ? `and count every ${nthBeat(result.every)}.` : '';
    field('skip').textContent = result.tempo ? `My metronome can't do ${result.tempo}` : '';
    field('skip').value = result.tempo ?? '';
    field('skip').hidden = !result.tempo;
    field('skipped').replaceChildren(...skipping);
    field('forget').textContent = `Forget all skipped tempos (${skipped.size})`;
    field('forget').hidden = !skipped.size;
    document.querySelector('tbody').replaceChildren(...rows);
  }

  addEventListener('input', render);

  addEventListener('click', ({ target }) => {
    if (!(target instanceof HTMLButtonElement)) return;
    if (target.matches('#skip')) skipped.add(Number(target.value));
    if (target.matches('#skipped button')) skipped.delete(Number(target.value));
    if (target.matches('#forget')) skipped.clear();
    remember();
    render();
  });

  render();
</script>
